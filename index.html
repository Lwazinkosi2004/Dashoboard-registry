<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Registry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand" href="#">Dashboard Registry</a>
        <div>
            <button class="btn btn-outline-light me-2" onclick="showSection('dashboardsSection')">Dashboards</button>
            <button class="btn btn-outline-light" onclick="showSection('dataSourcesSection')">Data Sources</button>
        </div>
    </nav>

    <main class="container py-4">
        <section id="dashboardsSection">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>Dashboards</h2>
                <button class="btn btn-primary" onclick="openDashboardModal()">Add Dashboard</button>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <input type="text" id="searchDashboards" class="form-control" placeholder="Search dashboard">
                </div>
            </div>

            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Owner</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="dashboardsTableBody"></tbody>
            </table>
        </section>

        <section id="dataSourcesSection" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>Data Sources</h2>
                <button class="btn btn-primary" onclick="openDataSourceModal()">Add Data Source</button>
            </div>

            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="dataSourcesTableBody"></tbody>
            </table>
        </section>
    </main>

    <div id="dashboardModal" class="modal-overlay">
        <div class="modal-panel">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>Add Dashboard</h3>
                <button class="btn-close" type="button" onclick="closeDashboardModal()" aria-label="Close"></button>
            </div>

            <input id="dashboardName" class="form-control mb-2" type="text" placeholder="Dashboard name">
            <textarea id="dashboardDescription" class="form-control mb-2" placeholder="Description"></textarea>
            <input id="dashboardUrl" class="form-control mb-2" type="url" placeholder="Dashboard URL">
            <input id="dashboardCategory" class="form-control mb-2" type="text" placeholder="Category">
            <input id="dashboardOwnerName" class="form-control mb-2" type="text" placeholder="Owner name">
            <select id="dashboardStatus" class="form-select mb-2">
                <option value="up">up</option>
                <option value="down">down</option>
                <option value="unknown">unknown</option>
            </select>
            <select id="dashboardDataSources" class="form-select mb-3" multiple></select>

            <div class="d-flex justify-content-end gap-2">
                <button class="btn btn-secondary" type="button" onclick="closeDashboardModal()">Cancel</button>
                <button class="btn btn-primary" type="button" onclick="saveDashboard()">Save Dashboard</button>
            </div>
        </div>
    </div>

    <div id="dataSourceModal" class="modal-overlay">
        <div class="modal-panel">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>Add Data Source</h3>
                <button class="btn-close" type="button" onclick="closeDataSourceModal()" aria-label="Close"></button>
            </div>

            <input id="dataSourceName" class="form-control mb-2" type="text" placeholder="Data source name">
            <input id="dataSourceType" class="form-control mb-2" type="text" placeholder="Type">
            <textarea id="dataSourceDescription" class="form-control mb-3" placeholder="Description"></textarea>

            <div class="d-flex justify-content-end gap-2">
                <button class="btn btn-secondary" type="button" onclick="closeDataSourceModal()">Cancel</button>
                <button class="btn btn-primary" type="button" onclick="saveDataSource()">Save Data Source</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
